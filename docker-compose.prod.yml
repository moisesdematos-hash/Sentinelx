version: '3.8'

services:
  # Banco de Dados PostgreSQL de Produção
  db:
    image: postgres:16-alpine
    container_name: sentinelx-db
    restart: always
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: SenhaSuperSegura123
      POSTGRES_DB: sentinelx_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Backend API Node.js/TypeScript
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sentinelx-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://sentinel_user:SenhaSuperSegura123@db:5432/sentinelx_prod?schema=public
      - NODE_ENV=production
      - PORT=5000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=c8f93b1a2e7d4f56890123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      - db

  # Frontend React Vite (Nginx Server)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
